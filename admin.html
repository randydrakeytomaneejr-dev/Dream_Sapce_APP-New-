<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream Space — Orders Dashboard</title>
<style>
  :root{ --bg:#0F0E0C; --ink:#F2EEE6; --sub:#A79E8E; --line:#2A271F; --accent:#2FA8A0; --card:#17150F; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:1.5rem; }
  h1{font-size:1.4rem; margin:0 0 1.2rem;}
  .login-box{ max-width:340px; margin:4rem auto; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:1.6rem; }
  .login-box input{ width:100%; padding:.6rem .7rem; background:#0F0E0C; border:1px solid var(--line);
    color:var(--ink); border-radius:7px; margin:.8rem 0; font-size:.9rem; }
  .login-box button, .refresh-btn{ width:100%; padding:.7rem; border:none; border-radius:7px; background:var(--accent);
    color:#08201E; font-weight:600; cursor:pointer; }
  .error{color:#E27D5A; font-size:.85rem; margin-top:.5rem;}
  table{width:100%; border-collapse:collapse; margin-top:1rem;}
  th, td{ text-align:left; padding:.7rem .6rem; border-bottom:1px solid var(--line); font-size:.85rem; vertical-align:top; }
  th{color:var(--sub); font-weight:500; font-size:.75rem; text-transform:uppercase; letter-spacing:.03em;}
  select{ background:#0F0E0C; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:.3rem .5rem; font-size:.8rem; }
  .empty{color:var(--sub); padding:2rem 0; text-align:center;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem; flex-wrap:wrap; gap:.6rem;}
  .refresh-btn{width:auto; padding:.5rem 1rem; font-size:.85rem;}
  #dashboard{display:none;}
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h1>Dream Space Orders</h1>
  <label style="font-size:.8rem; color:var(--sub);">Admin key</label>
  <input type="password" id="adminKey" placeholder="Enter admin key">
  <button onclick="login()">View orders</button>
  <p class="error" id="loginError" style="display:none;"></p>
</div>

<div id="dashboard">
  <div class="toolbar">
    <h1 style="margin:0;">Orders</h1>
    <button class="refresh-btn" onclick="loadOrders()">Refresh</button>
  </div>
  <div id="ordersContainer"></div>
</div>

<script>
let ADMIN_KEY = sessionStorage.getItem('dsAdminKey') || '';

function login(){
  const key = document.getElementById('adminKey').value;
  ADMIN_KEY = key;
  sessionStorage.setItem('dsAdminKey', key);
  loadOrders();
}

async function loadOrders(){
  const res = await fetch('/api/orders', { headers: { 'x-admin-key': ADMIN_KEY } });
  if(res.status === 401){
    document.getElementById('loginError').textContent = 'Incorrect admin key.';
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
    return;
  }
  const orders = await res.json();
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  renderOrders(orders);
}

function renderOrders(orders){
  const el = document.getElementById('ordersContainer');
  if(orders.length === 0){
    el.innerHTML = '<div class="empty">No orders yet.</div>';
    return;
  }
  el.innerHTML = `
    <table>
      <thead>
        <tr><th>Code</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Note</th><th>Status</th></tr>
      </thead>
      <tbody>
        ${orders.map(o => `
          <tr>
            <td style="font-weight:600; color:var(--accent);">${o.code || '—'}</td>
            <td>${new Date(o.createdAt).toLocaleString()}</td>
            <td>${o.customerName || '—'}<br><span style="color:var(--sub)">${o.customerPhone || ''}</span></td>
            <td>${o.items.map(it => `${it.qty}x ${it.name}`).join('<br>')}</td>
            <td>$${o.total}</td>
            <td>${o.customerNote || '—'}</td>
            <td>
              <select onchange="updateStatus('${o.id}', this.value)">
                ${['awaiting payment','payment confirmed','in production','delivered'].map(s =>
                  `<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`
                ).join('')}
              </select>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function updateStatus(id, status){
  await fetch('/api/orders/' + id, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json', 'x-admin-key': ADMIN_KEY},
    body: JSON.stringify({ status })
  });
}

if(ADMIN_KEY){ loadOrders(); }
</script>
</body>
</html>
