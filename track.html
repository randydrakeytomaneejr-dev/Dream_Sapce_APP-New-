<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Your Order — Dream Space</title>
<style>
  :root{ --bg:#0F0E0C; --ink:#F2EEE6; --sub:#A79E8E; --line:#2A271F; --accent:#2FA8A0; --gold:#C9A25A; --card:#17150F; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:2rem 1.5rem; }
  .serif{font-family:'Iowan Old Style',Georgia,serif;}
  .box{ max-width:440px; margin:2rem auto; }
  h1{font-size:1.4rem; margin:0 0 .3rem;}
  p.sub{color:var(--sub); font-size:.9rem; margin:0 0 1.5rem;}
  input{ width:100%; background:var(--card); border:1px solid var(--line); color:var(--ink);
    border-radius:7px; padding:.7rem .8rem; font-size:1rem; margin-bottom:.8rem; letter-spacing:.05em; text-transform:uppercase; }
  button{ width:100%; padding:.75rem; border:none; border-radius:7px; background:var(--accent);
    color:#08201E; font-weight:600; cursor:pointer; font-size:.95rem; }
  .back{display:inline-block; margin-bottom:1.5rem; color:var(--sub); text-decoration:none; font-size:.85rem;}
  .result{ margin-top:1.5rem; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1.2rem; display:none; }
  .result.show{display:block;}
  .status-badge{ display:inline-block; background:var(--accent); color:#08201E; padding:.3rem .8rem;
    border-radius:20px; font-size:.8rem; font-weight:600; text-transform:capitalize; margin-bottom:.8rem; }
  .item-line{display:flex; justify-content:space-between; font-size:.88rem; padding:.4rem 0; border-bottom:1px solid var(--line);}
  .total-line{display:flex; justify-content:space-between; font-weight:600; padding-top:.7rem;}
  .error{color:#E27D5A; font-size:.88rem; margin-top:.5rem;}
</style>
</head>
<body>
<div class="box">
  <a class="back" href="/">← Back to store</a>
  <h1 class="serif">Track your order</h1>
  <p class="sub">Enter the code you received when you placed your order.</p>
  <input type="text" id="codeInput" placeholder="DS-XXXXXX" maxlength="9">
  <button onclick="track()">Check status</button>
  <p class="error" id="errorNote" style="display:none;"></p>

  <div class="result" id="result">
    <span class="status-badge" id="statusBadge"></span>
    <div id="itemsList"></div>
    <div class="total-line"><span>Total</span><span id="totalAmt"></span></div>
  </div>
</div>

<script>
async function track(){
  const code = document.getElementById('codeInput').value.trim();
  const errorNote = document.getElementById('errorNote');
  const result = document.getElementById('result');
  errorNote.style.display = 'none';
  result.classList.remove('show');
  if(!code){ errorNote.textContent = 'Please enter your order code.'; errorNote.style.display = 'block'; return; }

  try{
    const res = await fetch('/api/track/' + encodeURIComponent(code));
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Order not found');

    document.getElementById('statusBadge').textContent = data.status;
    document.getElementById('itemsList').innerHTML = data.items.map(it =>
      `<div class="item-line"><span>${it.qty}x ${it.name}</span><span>$${it.price * it.qty}</span></div>`
    ).join('');
    document.getElementById('totalAmt').textContent = '$' + data.total;
    result.classList.add('show');
  }catch(e){
    errorNote.textContent = e.message;
    errorNote.style.display = 'block';
  }
}

document.getElementById('codeInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') track();
});
</script>
</body>
</html>
